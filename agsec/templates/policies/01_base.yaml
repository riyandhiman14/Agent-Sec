version: "1.0"
default: deny

statements:
  # Allow all IDE/internal tools — these are safe platform internals
  - sid: "AllowInternalTools"
    effect: allow
    actions:
      - "internal.*"

  # Block reads of sensitive files (secrets, credentials, keys)
  - sid: "BlockReadSecrets"
    effect: deny
    actions: ["file.read"]
    conditions:
      params.file_path:
        op: "regex"
        value: "(\\.env$|\\.env\\..+|credentials\\.json|secrets\\.ya?ml|\\.ssh/|id_rsa|\\.aws/credentials|\\.gcloud/|service[_-]account.*\\.json)"
    reason: "Reading secret files is blocked"

  # Allow all other read/search operations — low risk
  - sid: "AllowReadOps"
    effect: allow
    actions:
      - "file.read"
      - "file.glob"
      - "file.grep"

  # Allow agent/sub-agent spawning
  - sid: "AllowAgentSpawn"
    effect: allow
    actions:
      - "agent.spawn"

  # Allow unknown tools by default (fail-open for unrecognized tools)
  # Remove this statement for strict mode
  - sid: "AllowUnknownTools"
    effect: allow
    actions:
      - "unknown.*"
