version: "1.0"

statements:
  # Block payments to sanctioned countries
  - sid: "BlockSanctionedCountries"
    effect: deny
    actions: ["payment.*"]
    conditions:
      params.recipient.country:
        op: "in"
        value: ["KP", "IR", "SY", "CU"]
    reason: "Payments to sanctioned countries are prohibited"

  # Large payments require manual review
  - sid: "ReviewLargePayments"
    effect: review
    actions: ["payment.charge", "payment.transfer"]
    conditions:
      params.amount:
        op: ">"
        value: 10000
    reason: "Payments over $10,000 require manual review"

  # Allow normal payments
  - sid: "AllowPayments"
    effect: allow
    actions: ["payment.*"]
