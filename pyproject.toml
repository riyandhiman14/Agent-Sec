[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agsec"
version = "0.2.1"
description = "AI Agent Action Firewall core SDK"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = ["agent", "security", "policy", "sandbox"]
authors = [
  {name = "Riyandhiman", email = "noreply@example.com"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "PyYAML>=6.0"
]

[project.scripts]
agsec = "agsec.cli.main:main"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
langchain = ["langchain-core>=0.2.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0", "langchain-core>=0.2.0"]
dev = [
  "pytest>=6.0",
  "pytest-asyncio>=0.21.0",
  "black>=22.0.0",
  "isort>=5.10.0",
  "flake8>=4.0.0",
  "pre-commit>=2.17.0"
]

[project.urls]
"Homepage" = "https://github.com/riyandhiman14/Agent-Sec"
"Repository" = "https://github.com/riyandhiman14/Agent-Sec"
"Documentation" = "https://github.com/riyandhiman14/Agent-Sec#readme"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
