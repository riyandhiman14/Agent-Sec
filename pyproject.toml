[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agsec"
version = "0.1.2"
description = "AI Agent Action Firewall core SDK"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["agent", "security", "policy", "sandbox"]
authors = [
  {name = "Riyandhiman", email = "noreply@example.com"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "PyYAML>=6.0"
]

[project.urls]
"Homepage" = "https://github.com/riyandhiman14/Agent-Sec"
"Repository" = "https://github.com/riyandhiman14/Agent-Sec"
"Documentation" = "https://github.com/riyandhiman14/Agent-Sec#readme"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
